# Override SÓ PARA TESTE DE CARGA da pilha de produção (../../deploy/docker-compose.prod.yml). Ver ../README.md.
# Use via ./prod-like.sh (gera os arquivos de generated/). Caminhos relativos a deploy/ (primeiro arquivo do compose).
#
# O que muda em relação à produção, e por quê:
# - rate limits da API e do nginx muito maiores: o k6 sai de UM IP; com os limites reais (20 req/s por IP) o teste
#   mediria o limitador, não a API. Os limitadores continuam LIGADOS (custo de CPU incluso; o validador exige).
# - porta só em 127.0.0.1:${LOADTEST_HTTPS_PORT}; segredos, certificado autoassinado e .env descartáveis.
services:
  api:
    env_file: !override ../load-tests/prod-like/generated/.env.loadtest
    environment:
      SECURITY_RATELIMIT_AUTHPERMINUTE: "1000000"
      SECURITY_RATELIMIT_WEBHOOKPERMINUTE: "1000000"
  web:
    ports: !override
      - "127.0.0.1:${LOADTEST_HTTPS_PORT:-8443}:8443"
    volumes: !override
      - ../load-tests/prod-like/generated/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-api.inc:/etc/nginx/conf.d/proxy-api.inc:ro
      - ./security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
      - ../load-tests/prod-like/generated/certs:/etc/nginx/certs:ro
