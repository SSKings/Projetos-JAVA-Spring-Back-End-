# Mailpit: caixa de e-mail de DESENVOLVIMENTO (ADR-025). A API manda os e-mails para cá (localhost:1025) e eles
# aparecem em http://localhost:8025 — nada sai para a internet.
#   cd shopping-delivery/mailpit && docker compose up -d
# Portas só em 127.0.0.1: outra máquina da rede não lê os e-mails (eles têm links de confirmação e de nova senha).
name: shopeasy-mailpit

services:
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # página web e API
    environment:
      MP_MAX_MESSAGES: 500
