# Só para testes. Precisa ser específico do perfil: o application-dev.yml principal tem precedência sobre um
# config/application.yml genérico. Em dev de verdade o admin tem senha aleatória a cada start (revisão 2, R2).
app:
  admin:
    password: admin123
  # testes não dependem de SMTP: nada sai (só log); os testes de e-mail ligam e capturam o JavaMailSender
  mail:
    enabled: false
    async: false
  # os testes de checkout não confirmam e-mail; o teste do e-mail liga esta regra explicitamente
  require-verified-email: false
