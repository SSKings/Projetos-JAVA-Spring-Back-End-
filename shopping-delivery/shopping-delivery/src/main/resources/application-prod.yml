# Perfil de PRODUÇÃO. Todos os segredos vêm do ambiente; ProductionConfigValidator impede o startup
# com valores ausentes, fracos ou de desenvolvimento.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  # E-mail (ADR-025): Gmail com senha de app — smtp.gmail.com:587 com STARTTLS obrigatório (sem TLS, a senha iria
  # em texto puro). ProductionConfigValidator recusa subir sem host/usuário/senha/remetente e sem STARTTLS.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
  # Migrações com o DONO das tabelas; a aplicação usa um usuário só de leitura/escrita de dados (revisão 5, R5-4).
  # ProductionConfigValidator recusa subir se os dois forem o mesmo usuário.
  flyway:
    user: ${DATABASE_MIGRATION_USERNAME}
    password: ${DATABASE_MIGRATION_PASSWORD}
    # + callback só de PostgreSQL: tira do usuário da API o acesso ao histórico de migrações
    locations: classpath:db/migration,classpath:db/callback-postgres

server:
  # Atrás de proxy reverso (nginx) que termina o TLS. "native" (RemoteIpValve do Tomcat) só aceita
  # X-Forwarded-For/-Proto vindos de IPs internos (10/8, 172.16/12, 192.168/16, loopback) — o nginx na rede do
  # compose. "framework" aceitava de QUALQUER origem: se a API ficasse exposta por outro caminho, o IP usado no
  # bloqueio de login, no rate limit e na auditoria seria forjável (revisão 3, B6).
  # Proxy fora dessas faixas: SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES com a regex do IP dele.
  forward-headers-strategy: native
  tomcat:
    # Marco Civil, art. 15: registros de acesso guardados por 6 meses
    accesslog:
      enabled: true
      directory: ${ACCESS_LOG_DIR:/var/log/shopeasy}
      prefix: access
      suffix: .log
      max-days: 190
      pattern: '%t %{X-Forwarded-For}i %a "%r" %s %b %D'

logging:
  level:
    root: INFO

app:
  mail:
    from: ${MAIL_FROM}
    public-url: ${APP_PUBLIC_URL}
