# Configuração comum. Segredos NÃO têm valor padrão aqui: vêm de variáveis de ambiente (prod)
# ou de application-dev.yml (desenvolvimento). Ver docs/security-review.md (C1).
spring:
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  data:
    web:
      pageable:
        # Revisão 3, B5: /api/products é público; size=2000 numa página só era um jeito barato de pesar no banco
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Observabilidade (ADR-022). /actuator/health é público (só UP/DOWN); metrics e prometheus exigem ADMIN
# (SecurityConfig). Em produção o nginx só repassa /api/, então /actuator nem chega da internet.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

logging:
  pattern:
    # trace_id/span_id são colocados no MDC pelo agente OpenTelemetry: cada linha de log aponta para o trace
    level: "%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]"

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  # Chave AES-256 (base64 de 32 bytes) que cifra os segredos de MFA no banco
  encryption-key: ${APP_ENCRYPTION_KEY}
  # ADMIN só acessa /api/admin/** depois de ativar o MFA (TOTP)
  require-admin-mfa: ${REQUIRE_ADMIN_MFA:true}
  login:
    max-failed-attempts: 5
    lock-minutes: 15
  rate-limit:
    enabled: true
    # requisições por minuto, por IP
    auth-per-minute: 20
    webhook-per-minute: 120
    # contas novas por origem (IP ou /64 IPv6) em 24 h — anti-contas falsas para segurar estoque (revisão 4, R4-4)
    registrations-per-day: ${REGISTRATIONS_PER_DAY:10}

app:
  cors:
    # Origens exatas do front-end, separadas por vírgula (ex.: https://loja.exemplo.com.br)
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  terms-version: ${TERMS_VERSION:2026-11-05}
  # Hosts permitidos para imagens de produto (separados por vírgula). Ao mudar, atualize o img-src em
  # deploy/security-headers.inc (revisão 4, R4-8).
  product-image-hosts: ${PRODUCT_IMAGE_HOSTS:images.unsplash.com}
  admin:
    name: ${ADMIN_NAME:Administrador}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  # Recebedor Pix. Ver README → "Pagamento via Pix".
  pix:
    key: ${PIX_KEY}
    merchant-name: ${PIX_MERCHANT_NAME}
    merchant-city: ${PIX_MERCHANT_CITY}
    expiration-minutes: ${PIX_EXPIRATION_MINUTES:30}
    webhook-secret: ${PIX_WEBHOOK_SECRET:}
    # IPs/CIDRs do PSP autorizados a chamar o webhook (vazio = qualquer IP; use em produção)
    webhook-allowed-ips: ${PIX_WEBHOOK_ALLOWED_IPS:}
    expiration-check-ms: 60000
  # Bot de administração no Telegram (ADR-024): avisos de pedidos e gestão de pedidos/usuários pelo chat.
  # É um bot DIFERENTE do que manda os alertas do Grafana. Configure com scripts/telegram-admin-bot-setup.sh.
  telegram-bot:
    enabled: ${TELEGRAM_ADMIN_BOT_ENABLED:false}
    token: ${TELEGRAM_ADMIN_BOT_TOKEN:}
    # chatId:email-do-admin, separados por vírgula
    admins: ${TELEGRAM_ADMIN_BOT_ADMINS:}
