# nginx de produção: TLS, cabeçalhos de segurança, SPA e proxy de /api para a API (mesma origem).
# Imagem nginx-unprivileged: escuta em 8080/8443 dentro do container (docker-compose mapeia 80/443).

# Rate limit na borda (complementa o RateLimitFilter da API, que é por instância)
# - auth (login/cadastro): rígido, contra força bruta.
# - api: 100 req/s por IP (rajada 200). Antes era 20r/s/burst 40: no teste de carga (load-tests/prod-like, edge.js) um
#   IP passava a receber 429 a partir de 30 req/s — clientes atrás do MESMO IP (CGNAT de operadora móvel, rede de
#   empresa, Wi-Fi público) somam requisições e ~100-200 pessoas navegando já esbarravam. 100r/s ainda corta um IP
#   abusivo bem abaixo da capacidade da API (~700 req/s medida); ataque distribuído é papel de WAF/CDN.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_status 429;

server_tokens off;

server {
    listen 8080;
    server_name _;
    # HTTP só redireciona para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 1m;
    root /usr/share/nginx/html;

    # Cabeçalhos de segurança (docs/security-review.md, B2/M1). Ficam em security-headers.inc porque
    # o nginx descarta os add_header do nível "server" quando um location declara os seus.
    include /etc/nginx/conf.d/security-headers.inc;

    # assets com hash no nome: cache longo
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: rotas do React caem no index.html (que não é cacheado)
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    # login/cadastro: limite mais rígido
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    # Webhook Pix. Com PSP, habilite mTLS montando o CA do PSP e descomentando:
    #   no bloco server:  ssl_client_certificate /etc/nginx/certs/psp-ca.pem;  ssl_verify_client optional;
    #   aqui:             if ($ssl_client_verify != SUCCESS) { return 403; }
    location = /api/payments/pix/webhook {
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    # nada de Swagger/H2 pela internet (já desligados no perfil prod)
    location ~ ^/(swagger-ui|v3/api-docs|h2-console) {
        return 404;
    }
}
