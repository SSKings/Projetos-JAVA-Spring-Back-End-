# Produção: tudo que é segredo vem do ambiente, sem valor padrão (a aplicação não sobe sem eles).
# Revisão de segurança 3: antes, JWT_SECRET ausente caía em "secret-key" (público → token forjado de qualquer
# usuário), o banco usava postgres/postgres fixo e o data.sql criava usuários de exemplo, inclusive um ADMIN.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver

# Só os dados de referência (data.sql). continue-on-error: no restart as linhas já existem (chave duplicada).
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=update

# Mínimo de 32 caracteres (JwtTokenService recusa menos): openssl rand -base64 48
security.jwt.secret=${JWT_SECRET}
