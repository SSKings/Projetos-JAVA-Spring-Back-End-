
spring.datasource.url=jdbc:h2:mem:gestor_financeiro
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=user
spring.datasource.password=pass
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=embedded
spring.sql.init.data-locations=classpath:data.sql,classpath:data-demo.sql
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Aleatório a cada start, a menos que JWT_SECRET esteja definida. O antigo padrão "secret-key" era público
# (está no repositório): qualquer um forjava token de qualquer usuário (revisão de segurança 3).
security.jwt.secret=${JWT_SECRET:${random.value}}
