# Configuração dos testes: sobrepõe src/main/resources/application.properties (MySQL local),
# que não existe no runner do CI. H2 em memória, esquema criado e descartado a cada execução.
spring.datasource.url=jdbc:h2:mem:web_security_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
