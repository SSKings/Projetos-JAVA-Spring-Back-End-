# Atualizações automáticas de dependências (docs/security-review.md, A3; docs/dev-workflow.md).
#
# - minor/patch são agrupadas: um PR por ecossistema, em vez de um PR por dependência.
# - major é ignorada: muda API/comportamento (ex.: Tailwind 3 -> 4 quebrou o build) e exige migração planejada.
#   Atualizações de segurança continuam chegando (são abertas pelo Dependabot security updates, à parte).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      # OpenTelemetry do navegador num grupo próprio: os pacotes só funcionam todos na mesma linha. Misturados no grupo
      # geral, um PR levava as instrumentações para a 0.30x (core 3.x) e deixava o resto na 2.x — o npm não instalava.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      npm-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@opentelemetry/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Linha 3.x do SDK (instrumentações 0.30x, API 1.10): o sdk-trace-web foi descontinuado sem substituto estável
      # para navegador (o @opentelemetry/browser-sdk ainda é 0.x). Migrar junto, quando ele estabilizar.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/instrumentation*"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">=0.300.0"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imagem do PostgreSQL no compose de produção (fixada por digest; revisão 3, M4)
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Actions fixadas por SHA (revisão 3, M7): o Dependabot atualiza o SHA e o comentário da versão
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
