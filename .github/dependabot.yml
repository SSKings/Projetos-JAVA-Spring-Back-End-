# Atualizações automáticas de dependências (docs/security-review.md, A3; docs/dev-workflow.md).
#
# - minor/patch são agrupadas: um PR por ecossistema, em vez de um PR por dependência.
# - major é ignorada: muda API/comportamento (ex.: Tailwind 3 -> 4 quebrou o build) e exige migração planejada.
#   Atualizações de segurança continuam chegando (são abertas pelo Dependabot security updates, à parte).
version: 2
updates:
  - package-ecosystem: maven
    directory: /shopping-delivery/shopping-delivery
    schedule: { interval: weekly }
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /shopping-delivery-frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/shopping-delivery/shopping-delivery, /shopping-delivery-frontend]
    schedule: { interval: weekly }
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imagem do PostgreSQL no compose de produção (fixada por digest; revisão 3, M4)
  - package-ecosystem: docker-compose
    directory: /shopping-delivery/deploy
    schedule: { interval: weekly }
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Actions fixadas por SHA (revisão 3, M7): o Dependabot atualiza o SHA e o comentário da versão
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
