name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Revisão de segurança 3, M7: o GITHUB_TOKEN dos jobs só lê o repositório (o padrão pode ser leitura E escrita).
# Nenhum job publica nada; se algum precisar, ele declara a permissão extra só para si.
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # O Maven Wrapper baixa o Maven a cada execução; uma falha de rede nesse download derrubava o CI.
      - name: Cache Maven Wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      - name: Build, Test and Coverage check (JaCoCo)
        run: ./mvnw clean verify

      # Teste de mutação das regras de segurança e de dinheiro (Pix, TOTP, senha, bloqueio, limite por IP, validador)
      - name: Mutation testing (PIT)
        run: ./mvnw -B pitest:mutationCoverage

      - name: Test Pix webhook simulation script
        run: ../scripts/simulate-pix-payment.test.sh

      # Dependências de runtime x banco OSV (Tomcat, Jackson etc. vêm do BOM e o Dependabot não as vê)
      - name: Test CVE check script
        run: python3 -m unittest discover -s ../scripts -p 'test_check_dependency_cves.py'
      - name: Check dependency CVEs (OSV)
        run: python3 ../scripts/check-dependency-cves.py

      # Assistente do bot de administração (ADR-024) contra um Telegram falso
      - name: Test Telegram admin bot setup script
        run: python3 -m unittest discover -s ../scripts -p 'test_telegram_admin_bot_setup.py'

      # Revisão de segurança 3: backup cifrado do banco (M6) e actions/imagens fixadas por hash (M4/M7)
      - name: Test database backup scripts
        run: python3 -m unittest discover -s ../scripts -p 'test_backup_db.py'
      # Script que roda localmente os passos de um job deste arquivo (lição do PR da revisão 5)
      - name: Test local CI job runner
        run: python3 -m unittest discover -s ../scripts -p 'test_run_ci_job.py'
      - name: Check pinning (actions by SHA, production images by digest)
        run: |
          python3 -m unittest discover -s ../scripts -p 'test_check_pinning.py'
          python3 ../scripts/check-pinning.py

      # Logs de produção: rotação em todo serviço do compose e JSON (ECS) no perfil prod (análise de logs, 2026-11-15)
      - name: Check production logging (rotation, JSON)
        run: python3 -m unittest discover -s ../scripts -p 'test_production_logging.py'

      # Dashboards e alertas do Grafana (observability-stack/): JSON, datasources, grade, templates e rotas citadas
      - name: Validate Grafana dashboards and alerts
        run: python3 -m unittest discover -s ../scripts -p 'test_grafana_provisioning.py'

      # Teste funcional da API rodando de verdade (load-tests/smoke.js, k6): o fluxo de compra completo, de ponta a ponta
      - name: API smoke test (k6)
        run: |
          # o smoke fecha pedido sem caixa de e-mail: sem envio e sem exigir e-mail confirmado (ADR-025)
          MAIL_ENABLED=false REQUIRE_VERIFIED_EMAIL=false java -jar target/ecommerce-*.jar > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8080/actuator/health >/dev/null 2>&1 && break; sleep 2; done
          ../load-tests/run.sh smoke --quiet || { echo "--- log da API ---"; tail -80 /tmp/api.log; exit 1; }
      - name: Validate load test scripts (k6 inspect)
        working-directory: load-tests
        run: |
          K6_IMAGE=$(sed -n 's/^K6_IMAGE="\(.*\)"$/\1/p' run.sh)   # versão única, definida em run.sh
          for t in load stress alerts; do
            docker run --rm -v "$PWD:/scripts" -w /scripts "$K6_IMAGE" inspect "/scripts/$t.js" >/dev/null
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test and Coverage check (Vitest)
        run: npm run coverage
      # Os testes rodam com css: false e não passam pelo PostCSS/Tailwind: só o build pega
      # quebras de estilo/empacotamento (ex.: Tailwind 3 -> 4, ver docs/dev-workflow.md)
      - name: Production build
        run: npm run build

  migrations:
    name: Migrações
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Migração aplicada em produção não pode mudar (o Flyway recusaria subir): só se acrescentam arquivos novos.
      - name: Migrações existentes não foram editadas
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status "origin/$BASE...HEAD" -- backend/src/main/resources/db/migration | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "::error::Migração existente alterada, renomeada ou removida. Crie uma nova (V<n+1>__...sql):"
            echo "$changed"
            exit 1
          fi
          echo "ok: só migrações novas"

  production:
    name: Produção (E2E, upgrade e scan)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      PL: ./load-tests/prod-like/prod-like.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # PR: sobe a versão da main (pilha de produção: PostgreSQL com 3 usuários, API perfil prod, nginx TLS), cria dados
      # com o smoke, e só então sobe a do PR por cima, com os MESMOS segredos e o mesmo volume — as migrações novas
      # rodam sobre um banco com dados, como num deploy de verdade.
      - name: Upgrade — sobe a versão atual da main e cria dados
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git worktree add -q ../base "origin/$BASE"
          (cd ../base && $PL up && $PL smoke --quiet)
          cp -r ../base/load-tests/prod-like/generated load-tests/prod-like/

      - name: Sobe a versão do PR (migrações sobre os dados existentes)
        run: $PL up

      - name: Teste ponta a ponta (k6 através do nginx TLS)
        run: $PL smoke --quiet

      # Barra vulnerabilidade HIGH/CRITICAL que já tem correção. Exceções justificadas e com validade: .trivyignore.yaml
      - name: Scan das imagens (Trivy)
        run: |
          for image in shopeasy-loadtest-api:latest shopeasy-loadtest-web:latest; do
            docker image inspect "$image" >/dev/null   # falha se a imagem não existir (não pular o scan em silêncio)
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore.yaml:/ignore.yaml:ro" \
              aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
              image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --ignorefile /ignore.yaml --exit-code 1 "$image"
            echo "::endgroup::"
          done

      - name: Logs (em caso de falha)
        if: failure()
        run: docker logs --tail 200 shopeasy-loadtest-api-1 || true

      - name: Derruba a pilha
        if: always()
        run: $PL down || true
