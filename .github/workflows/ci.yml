name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  api-gestor-financeiro:
    name: API Gestor Financeiro
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api.gestor.financeiro

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify -Dspring.profiles.active=test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key-at-least-32-chars' }}

  shopping-delivery:
    name: Shopping Delivery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopping-delivery/shopping-delivery

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test and Coverage check (JaCoCo)
        run: ./mvnw clean verify

  shopping-delivery-frontend:
    name: Shopping Delivery Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopping-delivery-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: shopping-delivery-frontend/package-lock.json

      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test and Coverage check (Vitest)
        run: npm run coverage

  spring-ai:
    name: Spring AI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-ai

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests - requires OpenAI API key)
        run: ./mvnw clean compile -DskipTests

  voice-transcription:
    name: Voice Transcription
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-transcription

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests - requires OpenAI API key)
        run: ./mvnw clean compile -DskipTests

  text-to-speech:
    name: Text to Speech
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text-to-speec

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests - requires OpenAI API key)
        run: ./mvnw clean compile -DskipTests

  web-security:
    name: Web Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-security

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify
