name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  api-gestor-financeiro:
    name: API Gestor Financeiro
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api.gestor.financeiro

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify -Dspring.profiles.active=test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key-at-least-32-chars' }}

  shopping-delivery:
    name: Shopping Delivery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopping-delivery/shopping-delivery

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test and Coverage check (JaCoCo)
        run: ./mvnw clean verify

      - name: Test Pix webhook simulation script
        run: ../scripts/simulate-pix-payment.test.sh

      # Dependências de runtime x banco OSV (Tomcat, Jackson etc. vêm do BOM e o Dependabot não as vê)
      - name: Test CVE check script
        run: python3 -m unittest discover -s ../scripts -p 'test_check_dependency_cves.py'
      - name: Check dependency CVEs (OSV)
        run: python3 ../scripts/check-dependency-cves.py

      # Dashboards e alertas do Grafana (observability-stack/): JSON, datasources, grade, templates e rotas citadas
      - name: Validate Grafana dashboards and alerts
        run: python3 -m unittest discover -s ../scripts -p 'test_grafana_provisioning.py'

      # Teste funcional da API rodando de verdade (load-tests/smoke.js, k6): o fluxo de compra completo, de ponta a ponta
      - name: API smoke test (k6)
        run: |
          java -jar target/ecommerce-*.jar > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8080/actuator/health >/dev/null 2>&1 && break; sleep 2; done
          ../load-tests/run.sh smoke --quiet || { echo "--- log da API ---"; tail -80 /tmp/api.log; exit 1; }
      - name: Validate load test scripts (k6 inspect)
        working-directory: shopping-delivery/load-tests
        run: |
          K6_IMAGE=$(sed -n 's/^K6_IMAGE="\(.*\)"$/\1/p' run.sh)   # versão única, definida em run.sh
          for t in load stress alerts; do
            docker run --rm -v "$PWD:/scripts" -w /scripts "$K6_IMAGE" inspect "/scripts/$t.js" >/dev/null
          done

  shopping-delivery-frontend:
    name: Shopping Delivery Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopping-delivery-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: shopping-delivery-frontend/package-lock.json

      - run: npm ci
      - name: Dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test and Coverage check (Vitest)
        run: npm run coverage
      # Os testes rodam com css: false e não passam pelo PostCSS/Tailwind: só o build pega
      # quebras de estilo/empacotamento (ex.: Tailwind 3 -> 4, ver docs/dev-workflow.md)
      - name: Production build
        run: npm run build

  spring-ai:
    name: Spring AI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-ai

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests - requires OpenAI API key)
        run: ./mvnw clean compile -DskipTests

  voice-transcription:
    name: Voice Transcription
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-transcription

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests - requires OpenAI API key)
        run: ./mvnw clean compile -DskipTests

  text-to-speech:
    name: Text to Speech
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text-to-speec

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests - requires OpenAI API key)
        run: ./mvnw clean compile -DskipTests

  web-security:
    name: Web Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-security

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify
