name: CodeQL

# Análise estática de segurança (injeção, XSS, path traversal, desserialização…) do Java e do TypeScript.
# Os alertas aparecem em Security → Code scanning.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '41 6 * * 1'   # toda segunda: regras novas do CodeQL também pegam código antigo

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # só este job publica (os resultados da análise)
    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin, javascript-typescript ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
