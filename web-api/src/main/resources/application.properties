spring.datasource.url=jdbc:mysql://localhost:3306/bancoTest
# Credenciais do MySQL local vêm do ambiente (revisão de segurança 3: a senha estava no repositório público).
# Ex.: DB_USERNAME=root DB_PASSWORD=... ./mvnw spring-boot:run
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

logging.level.org.springframework.web: DEBUG
logging.level.org.hibernate: INFO

server.port=8081
